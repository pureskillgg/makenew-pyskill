---
name: Format
run-name: "${{ github.event_name == 'pull_request' && format('Format: {0}', github.event.pull_request.title) || format('Format {0}', github.ref_name) }}"

on:
  pull_request:
    branches:
      - master
  workflow_dispatch: {}
  repository_dispatch:
    types:
      - format

concurrency:
  group: format-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  fix:
    # Skip a fork's PR and a run Dependabot starts (neither gets the secrets this job pushes with),
    # and Dependabot's own PRs (a pushed format commit stops Dependabot rebasing them).
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GH_TOKEN }}
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        id: import_gpg
        with:
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_committer_name: ${{ secrets.GIT_USER_NAME }}
          git_committer_email: ${{ secrets.GIT_USER_EMAIL }}
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Setup
        uses: ./.github/actions/setup
      - name: Format
        run: make format
      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Run format
          commit_user_name: ${{ secrets.GIT_USER_NAME }}
          commit_user_email: ${{ secrets.GIT_USER_EMAIL }}
          commit_author: ${{ secrets.GIT_USER_NAME }} <${{ secrets.GIT_USER_EMAIL }}>
